<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Upload de Vídeo de Handball</title>
  <style>
    body { font-family: Arial; max-width: 500px; margin: 40px auto; }
    #progress-container { margin-top: 20px; display: none; }
    #progress-bar { width: 0%; height: 20px; background-color: #0078ff; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

<h2>Upload de Vídeo de Handball</h2>

<form id="uploadForm">
  <label>Vídeo (.mp4)</label>
  <input type="file" id="file" name="file" accept="video/mp4" required>

  <label>O seu nome</label>
  <input type="text" id="user_name" required>

  <label>O seu email</label>
  <input type="email" id="user_email" required>

  <label>Início (segundos)</label>
  <input type="number" id="start_time" min="0">

  <label>Duração (segundos)</label>
  <input type="number" id="duration" min="1">

  <button type="submit">Enviar vídeo</button>
</form>

<div id="progress-container">
  <div id="progress-bar"></div>
</div>

<div id="status"></div>

<script>
const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB
const UPLOAD_URL = "https://handball-video-pipeline-git-1007213034860.europe-west1.run.app/upload_chunk";

const form = document.getElementById("uploadForm");
const progressContainer = document.getElementById("progress-container");
const progressBar = document.getElementById("progress-bar");
const status = document.getElementById("status");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const file = document.getElementById("file").files[0];
  const name = document.getElementById("user_name").value;
  const email = document.getElementById("user_email").value;
  const start = document.getElementById("start_time").value;
  const duration = document.getElementById("duration").value;

  progressContainer.style.display = "block";
  status.innerHTML = "A enviar vídeo...";

  let startByte = 0;
  let index = 0;
  const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

  while (startByte < file.size) {
    const chunk = file.slice(startByte, startByte + CHUNK_SIZE);

    const formData = new FormData();
    formData.append("chunk", chunk);
    formData.append("index", index);
    formData.append("filename", file.name);
    formData.append("user_name", name);
    formData.append("user_email", email);
    formData.append("start_time", start);
    formData.append("duration", duration);

    await fetch(UPLOAD_URL, { method: "POST", body: formData });

    startByte += CHUNK_SIZE;
    index++;

    progressBar.style.width = ((startByte / file.size) * 100) + "%";
  }

  status.innerHTML = "A finalizar upload...";

  await fetch(`${UPLOAD_URL}?finish=1&filename=${file.name}`);

  progressBar.style.backgroundColor = "#00c851";
  status.innerHTML = "✔ Vídeo enviado com sucesso!";
});
</script>

</body>
</html>
