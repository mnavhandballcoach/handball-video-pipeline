<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Upload de vídeo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 0.9rem;
    }
    input, button {
      margin-top: 4px;
      padding: 8px;
      font-size: 0.9rem;
      width: 100%;
      box-sizing: border-box;
    }
    #progress-container {
      margin-top: 16px;
      background: #eee;
      border-radius: 4px;
      overflow: hidden;
      height: 10px;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width 0.1s linear;
    }
    #status {
      margin-top: 12px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Upload de vídeo</h1>

  <label for="file">Vídeo (.mp4 / .mov)</label>
  <input type="file" id="file" accept="video/*" />

  <label for="name">Nome</label>
  <input type="text" id="name" placeholder="Opcional" />

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Opcional" />

  <label for="start">Início (segundos)</label>
  <input type="number" id="start" min="0" value="0" />

  <label for="duration">Duração (segundos)</label>
  <input type="number" id="duration" min="0" value="0" />

  <button id="upload-btn">Enviar vídeo</button>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="status"></div>

  <script>
    // URL ABSOLUTO DO CLOUD RUN (OBRIGATÓRIO)
    const UPLOAD_URL =
      "https://handball-video-pipeline-git-1007213034860.europe-west1.run.app/upload_chunk";

    const CHUNK_SIZE = 5 * 1024 * 1024; // 5MB por chunk

    const fileInput = document.getElementById("file");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const startInput = document.getElementById("start");
    const durationInput = document.getElementById("duration");
    const uploadBtn = document.getElementById("upload-btn");
    const progressBar = document.getElementById("progress-bar");
    const statusEl = document.getElementById("status");

    function setStatus(msg) {
      statusEl.textContent = msg;
      console.log("STATUS:", msg);
    }

    // DEBUG: função para enviar chunk via XHR
    function uploadChunkXHR(chunk, index, filename, name, email, start, duration) {
      return new Promise((resolve, reject) => {
        console.log("DEBUG: Enviando chunk", index, "tamanho:", chunk.size);

        const xhr = new XMLHttpRequest();
        xhr.open("POST", UPLOAD_URL);

        // DEBUG: progresso do upload
        xhr.upload.onprogress = (e) => {
          console.log(
            `DEBUG: XHR progresso chunk ${index}: ${e.loaded}/${e.total}`
          );
        };

        xhr.onload = () => {
          console.log("DEBUG: Resposta chunk", index, "→", xhr.status, xhr.responseText);
          if (xhr.status === 200) resolve();
          else reject("Erro no chunk " + index + " (HTTP " + xhr.status + ")");
        };

        xhr.onerror = () => {
          console.log("DEBUG: XHR erro no chunk", index);
          reject("Erro de rede no chunk " + index);
        };

        const formData = new FormData();
        formData.append("chunk", chunk);
        formData.append("index", index);
        formData.append("filename", filename);
        formData.append("user_name", name);
        formData.append("user_email", email);
        formData.append("start_time", start);
        formData.append("duration", duration);

        xhr.send(formData);
      });
    }

    // DEBUG: finalização
    function finalizeUploadXHR(filename, name, email, start, duration) {
      return new Promise((resolve, reject) => {
        console.log("DEBUG: Finalizando upload…");

        const xhr = new XMLHttpRequest();
        xhr.open("POST", UPLOAD_URL);

        xhr.onload = () => {
          console.log("DEBUG: Resposta finalização →", xhr.status, xhr.responseText);
          if (xhr.status === 200) resolve();
          else reject("Erro ao finalizar upload (HTTP " + xhr.status + ")");
        };

        xhr.onerror = () => {
          console.log("DEBUG: XHR erro na finalização");
          reject("Erro de rede ao finalizar upload");
        };

        const formData = new FormData();
        formData.append("finish", 1);
        formData.append("filename", filename);
        formData.append("user_name", name);
        formData.append("user_email", email);
        formData.append("start_time", start);
        formData.append("duration", duration);

        xhr.send(formData);
      });
    }

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus("⚠️ Escolhe um ficheiro de vídeo primeiro.");
        return;
      }

      const name = nameInput.value || "";
      const email = emailInput.value || "";
      const start = startInput.value || "0";
      const duration = durationInput.value || "0";

      uploadBtn.disabled = true;
      setStatus("🚀 A enviar vídeo em chunks...");
      progressBar.style.width = "0%";

      let startByte = 0;
      let index = 0;

      try {
        while (startByte < file.size) {
          const chunk = file.slice(startByte, startByte + CHUNK_SIZE);

          console.log("DEBUG: Chunk lido →", chunk);

          await uploadChunkXHR(chunk, index, file.name, name, email, start, duration);

          startByte += CHUNK_SIZE;
          index++;

          const percent = Math.min(100, (startByte / file.size) * 100);
          progressBar.style.width = percent + "%";
        }

        setStatus("⏳ A finalizar o upload no servidor…");

        await finalizeUploadXHR(file.name, name, email, start, duration);

        progressBar.style.width = "100%";
        setStatus("🎉 Upload concluído! O vídeo está a ser processado.");
      } catch (err) {
        console.error("DEBUG: ERRO FINAL:", err);
        setStatus("❌ Erro no upload: " + err);
      } finally {
        uploadBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
