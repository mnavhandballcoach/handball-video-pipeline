<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Upload de Vídeo de Handball</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }
    input[type="file"], input[type="email"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #0078ff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005fcc;
    }
    #progress-container {
      margin-top: 20px;
      display: none;
    }
    #progress-bar {
      width: 0%;
      height: 20px;
      background-color: #0078ff;
      border-radius: 4px;
    }
    #status {
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Upload de Vídeo de Handball</h2>
  <p>Envie o seu vídeo para ser analisado automaticamente.</p>

  <form id="uploadForm">
    <label for="file">Vídeo (.mp4)</label>
    <input type="file" id="file" name="file" accept="video/mp4" required>

    <label for="user_email">O seu email</label>
    <input type="email" id="user_email" name="user_email" placeholder="email@exemplo.com" required>

    <button type="submit">Enviar vídeo</button>
  </form>

  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="status"></div>

  <script>
    const form = document.getElementById("uploadForm");
    const progressContainer = document.getElementById("progress-container");
    const progressBar = document.getElementById("progress-bar");
    const status = document.getElementById("status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const fileInput = document.getElementById("file");
      const emailInput = document.getElementById("user_email");

      if (!fileInput.files.length) {
        alert("Selecione um vídeo.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("user_email", emailInput.value);

      const xhr = new XMLHttpRequest();

      // URL FINAL DO TEU CLOUD RUN
      xhr.open("POST", "https://handball-video-pipeline-git-1007213034860.europe-west1.run.app/upload", true);

      xhr.upload.onprogress = function(event) {
        if (event.lengthComputable) {
          const percent = (event.loaded / event.total) * 100;
          progressContainer.style.display = "block";
          progressBar.style.width = percent + "%";
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          status.innerHTML = "✔ Vídeo enviado com sucesso! Irá receber o resultado por email.";
          progressBar.style.backgroundColor = "#00c851";
        } else {
          status.innerHTML = "❌ Erro ao enviar o vídeo.";
          progressBar.style.backgroundColor = "#ff4444";
        }
      };

      xhr.onerror = function() {
        status.innerHTML = "❌ Erro de rede ao enviar o vídeo.";
      };

      xhr.send(formData);
    });
  </script>

</body>
</html>
